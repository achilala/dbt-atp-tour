name: 'dbt_atp_tour'
version: '2.0.0'
config-version: 2

profile: 'dbt_atp_tour'

vars:
  dbt_date_format: '%Y-%m-%d'
  dbt_time_format: '%H:%M:%S%z'
  dbt_datetime_format: '{{ var("dbt_date_format") }} {{ var("dbt_time_format") }}'
  dbt_timezone: 'Pacific/Auckland'
  dbt_current_date: '{{ run_started_at.astimezone(modules.pytz.timezone(var("dbt_timezone"))).strftime(var("dbt_date_format")) }}'
  dbt_current_datetime: '{{ run_started_at.astimezone(modules.pytz.timezone(var("dbt_timezone"))).strftime(var("dbt_datetime_format")) }}'

  calendar_start_date: '1800-01-01'
  calendar_end_date: '{{ var("dbt_current_date") }}'

  # Unit conversion — replaces the ref_conversion_units seed
  cm_to_inches: 0.0328084

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  dbt_atp_tour:
    +schema: lookup
    +docs:
      node_color: "black"

models:
  dbt_atp_tour:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +schema: staging
      +materialized: view

    intermediate:
      +schema: intermediate
      +materialized: view

    marts:
      core:
        +schema: mart
        +materialized: table
      reporting:
        +schema: reporting
        +materialized: view

data_tests:
  dbt_atp_tour:
    +docs:
      node_color: "red"
